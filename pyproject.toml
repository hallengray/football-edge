[project]
name = "football-edge"
version = "0.2.0"
description = "Personal football value betting tool — Big 5 European leagues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "supabase>=2.10",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
