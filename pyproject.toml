[project]
name = "football-edge"
version = "0.1.0"
description = "Personal football value betting tool — EPL focus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "supabase>=2.10",
    "sports-betting==0.12.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
